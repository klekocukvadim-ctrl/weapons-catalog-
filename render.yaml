services:
  - type: web
    runtime: static
    name: weapons-catalog
    buildCommand: echo ok
    staticPublishPath: ./
    headers:
      - path: /sw.js
        name: Cache-Control
        value: "no-cache, no-store, must-revalidate, max-age=0"
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /manifest.json
        name: Cache-Control
        value: no-cache
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
